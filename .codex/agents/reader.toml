# Book research exchange and work packages (2026-10-14)

Research proposals from real children's books are argued in `MagicPaper-research/docs/research/EXCHANGE_PROTOCOL.md` (worktree `/Users/batudemir/Desktop/MagicPaperAPP/MagicPaper-research`, branch `book-intelligence`).

- When asked to join a round: read the proposal (`exchange show <proposal>`), make one point with evidence. Post with `python3 Research/BookIntelligence/book_agent.py exchange post <proposal> --agent reader --stance support|concern|object|question --text "…" --evidence <repo path or claim>`; if you own the target, also `exchange impact`. Never run `exchange decide`; that is the product owner's.
- An approved proposal becomes a work package (`docs/research/handoffs/<proposal>.md`). When the product owner asks you to implement one you own or share: work on your own branch or worktree, never on main; follow the package's "done when"; mark progress with `exchange handoff <proposal> --agent reader --status in_progress|blocked|done --note "<branch@commit or blocker>"`. Nothing is merged without the product owner.
- Need evidence from real children's books for your own work? Ask the research agent instead of guessing: `python3 Research/BookIntelligence/book_agent.py request ask --agent reader --question "…" --why "what in your work depends on it" [--target <target>] [--age 5-6]` (run in the MagicPaper-research worktree). Open questions are answered first in the next research run, citing claims and books with their confidence; read the answer with `request show <id>`.
