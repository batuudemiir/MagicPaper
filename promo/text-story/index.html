function rng(seed) {                 // mulberry32
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp01 = (v) => Math.max(0, Math.min(1, v));
const prog = (t, a, b) => clamp01((t - a) / (b - a));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeInOut = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const lerp = (a, b, t) => a + (b - a) * t;
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => [0, 1, 2].map((i) => Math.round(lerp(a[i], b[i], t)));
const css = (c, a = 1) => a >= 1 ? `rgb(${c[0]},${c[1]},${c[2]})` : `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
const bayer = (x, y) => (BAYER[((y % 4) + 4) % 4][((x % 4) + 4) % 4] + 0.5) / 16;

// ---------------------------------------------------------------------------
// Katmanlar: düşük çözünürlüklü piksel çizimi + yüksek çözünürlüklü yazı.
// flush() piksel katmanını 6× büyütüp basar, ardından bekleyen yazıları basar.
// ---------------------------------------------------------------------------
const out = document.getElementById('c');
const O = out.getContext('2d');
const lo = document.createElement('canvas');
lo.width = W; lo.height = H;
const L = lo.getContext('2d');
let texts = [];
let OX = 0, OY = 0;          // yerel koordinat başlangıcı
let clips = [];              // mutlak düşük çözünürlüklü kırpma dikdörtgenleri
let ALPHA = 1;

function flush() {
  O.imageSmoothingEnabled = false;
  O.drawImage(lo, 0, 0, W * S, H * S);
  L.clearRect(0, 0, W, H);
  for (const t of texts) drawText(t);
  texts = [];
}
function pushClip(x, y, w, h) {
  const r = { x: Math.round(x + OX), y: Math.round(y + OY), w: Math.round(w), h: Math.round(h) };
  const top = clips[clips.length - 1];
  if (top) {
    const x2 = Math.min(r.x + r.w, top.x + top.w), y2 = Math.min(r.y + r.h, top.y + top.h);
    r.x = Math.max(r.x, top.x); r.y = Math.max(r.y, top.y); r.w = Math.max(0, x2 - r.x); r.h = Math.max(0, y2 - r.y);
  }
  clips.push(r);
}
function popClip() { clips.pop(); }
function at(x, y, fn) { const ox = OX, oy = OY; OX += Math.round(x); OY += Math.round(y); fn(); OX = ox; OY = oy; }

function R(x, y, w, h, c, a = 1) {
  if (w <= 0 || h <= 0) return;
  let x0 = Math.round(x + OX), y0 = Math.round(y + OY), x1 = x0 + Math.round(w), y1 = y0 + Math.round(h);
  const cl = clips[clips.length - 1];
  if (cl) { x0 = Math.max(x0, cl.x); y0 = Math.max(y0, cl.y); x1 = Math.min(x1, cl.x + cl.w); y1 = Math.min(y1, cl.y + cl.h); }
  if (x1 <= x0 || y1 <= y0) return;
  L.fillStyle = css(c, a * ALPHA);
  L.fillRect(x0, y0, x1 - x0, y1 - y0);
}
function P(x, y, c, a = 1) { R(x, y, 1, 1, c, a); }
// Köşeleri 1 piksel kırpılmış kutu
function box(x, y, w, h, c, a = 1) {
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  R(x + 1, y, w - 2, 1, c, a); R(x, y + 1, w, h - 2, c, a); R(x + 1, y + h - 1, w - 2, 1, c, a);
}
function boxLine(x, y, w, h, c, a = 1) {
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  R(x + 1, y, w - 2, 1, c, a); R(x + 1, y + h - 1, w - 2, 1, c, a);
  R(x, y + 1, 1, h - 2, c, a); R(x + w - 1, y + 1, 1, h - 2, c, a);
}
// Bantlı gradyan; bant geçişlerinde 4×4 Bayer dither. dir: 'v' | 'h' | 'd'
function bands(x, y, w, h, stops, n, dir = 'v', clipped = true, a = 1) {
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  const cols = [];
  for (let i = 0; i < n; i++) cols.push(sampleStops(stops, (i + 0.5) / n));
  for (let j = 0; j < h; j++) {
    for (let i = 0; i < w; i++) {
      if (clipped && ((i === 0 || i === w - 1) && (j === 0 || j === h - 1))) continue;
      const v = dir === 'v' ? j / Math.max(1, h - 1) : dir === 'h' ? i / Math.max(1, w - 1)
        : (i / Math.max(1, w - 1) + j / Math.max(1, h - 1)) / 2;
      const f = v * n - 0.5;
      let k = Math.floor(f);
      const fr = f - k;
      if (fr > 0.6 && bayer(x + i + OX, y + j + OY) < (fr - 0.6) / 0.4) k++;
      k = Math.max(0, Math.min(n - 1, k));
      R(x + i, y + j, 1, 1, cols[k], a);
    }
  }
}
function sampleStops(stops, v) {
  const s = (stops.length - 1) * clamp01(v);
  const i = Math.min(stops.length - 2, Math.floor(s));
  return mix(stops[i], stops[i + 1], s - i);
}
function disc(cx, cy, r, c, a = 1) {
  for (let dy = -r; dy <= r; dy++) {
    const dx = Math.floor(Math.sqrt(r * r - dy * dy) + 0.35);
    R(cx - dx, cy + dy, dx * 2 + 1, 1, c, a);
  }
}
// Piksel ikonlar ('#' dolu)
const GLYPH = {
  house: ['...#...', '..###..', '.#####.', '#######', '.##.##.', '.##.##.', '.#####.'],

  bolt: ['...##', '..##.', '.####', '..##.', '.##..', '##...'],

function G(name, x, y, c, a = 1, scale = 1) {
  const g = GLYPH[name];
  for (let j = 0; j < g.length; j++)
    for (let i = 0; i < g[j].length; i++)
      if (g[j][i] === '#') R(x + i * scale, y + j * scale, scale, scale, c, a);
}
const gw = (name) => GLYPH[name][0].length;
const gh = (name) => GLYPH[name].length;

// Yazı: boyut düşük çözünürlük biriminde (5 → 30 px). Konum aynı 6 px ızgaraya oturur.
function font(size, bold) { return `${bold ? 700 : 400} ${Math.round(size * S)}px 'Pixelify Sans'`; }
function measure(s, size, bold) { O.font = font(size, bold); return O.measureText(s).width / S; }
function T(s, x, y, size, c, opt = {}) {
  const bold = !!opt.bold;
  O.font = font(size, bold);
  const wpx = O.measureText(s).width;
  let xl = (x + OX) * S;
  if (opt.align === 'center') xl -= wpx / 2;
  else if (opt.align === 'right') xl -= wpx;
  const xi = Math.round(xl / S) * S;
  const yi = Math.round(y + OY) * S;
  texts.push({ s, x: xi, y: yi, f: font(size, bold), c: css(c), a: (opt.a ?? 1) * ALPHA, clip: clips[clips.length - 1] });
  return wpx / S;
}
function drawText(t) {
  if (t.a <= 0) return;
  O.save();
  if (t.clip) { O.beginPath(); O.rect(t.clip.x * S, t.clip.y * S, t.clip.w * S, t.clip.h * S); O.clip(); }
  O.globalAlpha = t.a;
  O.font = t.f; O.fillStyle = t.c; O.textBaseline = 'top';
  O.fillText(t.s, t.x, t.y);
  O.restore();
}
function wrap(s, maxW, size, bold) {
  const words = s.split(' ');
  const lines = [];
  let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (measure(test, size, bold) <= maxW || !cur) cur = test;
    else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  return lines;
}

// Gökyüzü, güneş, ay, yıldızlar, bulutlar, şehir
// ---------------------------------------------------------------------------
// Öykünün saati: 0 şafak · 1 gündüz · 2 gün batımı · 3 gece
const TOD = [[0, 0], [4.5, 1], [12.5, 1.25], [17.5, 2], [21.2, 3], [99, 3]];
function tod(t) {
  for (let i = 0; i < TOD.length - 1; i++) {
    const [t0, p0] = TOD[i], [t1, p1] = TOD[i + 1];
    if (t <= t1) return lerp(p0, p1, easeInOut(prog(t, t0, t1)));
  }
  return 3;
}
const SKY = [
  ['#3B4A8C', '#B87AA8', '#FFB88A'],   // şafak
  ['#3F86D8', '#78B9EC', '#C9E8F8'],   // gündüz
  ['#3A3674', '#C8627C', '#FFA95A'],   // gün batımı
  ['#070B1E', '#141A42', '#262C62'],   // gece
].map((r) => r.map(hex));
function skyAt(p) {
  const i = Math.min(2, Math.floor(p)), f = p - i;
  return [0, 1, 2].map((k) => mix(SKY[i][k], SKY[i + 1][k], f));
}
const HORIZON = 266;
const skyImg = L.createImageData(W, H);
function drawSky(t, p) {
  const st = skyAt(p);
  const n = 12;
  const cols = [];
  for (let i = 0; i < n; i++) cols.push(sampleStops(st, (i + 0.5) / n));
  const d = skyImg.data;
  for (let y = 0; y < H; y++) {
    const f = (y / HORIZON) * n - 0.5;
    for (let x = 0; x < W; x++) {
      let k = Math.floor(f);
      const fr = f - k;
      if (fr > 0.55 && bayer(x, y) < (fr - 0.55) / 0.45) k++;
      k = Math.max(0, Math.min(n - 1, k));
      const c = cols[k], o = (y * W + x) * 4;
      d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255;
    }
  }
  L.putImageData(skyImg, 0, 0);

  // Yıldızlar
  const night = clamp01((p - 2.25) / 0.6);
  if (night > 0) {
    const r = rng(7);
    for (let i = 0; i < 46; i++) {
      const x = Math.floor(r() * W), y = Math.floor(r() * 190), ph = r() * 6.28, big = r() < 0.18;
      const tw = Math.sin(t * (1.3 + r()) + ph);
      const a = night * (tw > -0.4 ? 1 : 0.35);
      const col = r() < 0.3 ? hex('#FFE9B0') : hex('#FFFFFF');
      P(x, y, col, a);
      if (big && tw > 0.55) { P(x - 1, y, col, a * 0.5); P(x + 1, y, col, a * 0.5); P(x, y - 1, col, a * 0.5); P(x, y + 1, col, a * 0.5); }
    }
  }
  // Güneş: şafaktan gün batımına bir yay
  const sp = p / 2.2;
  if (sp < 1) {
    const x = Math.round(lerp(10, 170, sp));
    const y = Math.round(250 - Math.sin(Math.PI * sp) * 236);
    const warm = Math.abs(sp - 0.5) * 2;
    disc(x, y, 7, mix(hex('#FFF1A8'), hex('#FF9E4A'), warm), 0.35);
    disc(x, y, 6, mix(hex('#FFE680'), hex('#FFB347'), warm));
    disc(x - 1, y - 1, 3, mix(hex('#FFF8D0'), hex('#FFD08A'), warm));
  }
  // Piksel hilal ay
  const moon = clamp01((p - 2.35) / 0.55);
  if (moon > 0) {
    const mx = 20, my = Math.round(lerp(70, 22, easeOut(moon)));
    for (let dy = -6; dy <= 6; dy++)
      for (let dx = -6; dx <= 6; dx++) {
        const in1 = dx * dx + dy * dy <= 36, in2 = (dx - 3) * (dx - 3) + (dy + 2) * (dy + 2) <= 30;
        if (in1 && !in2) P(mx + dx, my + dy, hex('#F4EFC8'), moon);
      }
  }
  // Bulutlar
  const cloudCol = p < 1 ? mix(hex('#FFD2DC'), hex('#FFFFFF'), p)
    : p < 2 ? mix(hex('#FFFFFF'), hex('#F2A39C'), p - 1)
      : mix(hex('#F2A39C'), hex('#2A3166'), p - 2);
  const clouds = [[10, 44, 2.2, 0], [120, 18, 1.4, 1], [70, 90, 1.8, 2], [150, 128, 1.1, 0]];
  const shapes = [
    [[2, 0, 8, 2], [0, 2, 16, 3], [5, -2, 4, 2]],
    [[3, 0, 10, 2], [0, 2, 20, 3], [8, -2, 6, 2]],
    [[1, 0, 6, 2], [0, 2, 12, 2]],
  ];
  for (const [x0, y0, v, s] of clouds) {
    const x = Math.round(((x0 + t * v) % (W + 40)) - 20);
    for (const [dx, dy, w, h] of shapes[s]) R(x + dx, y0 + dy, w, h, cloudCol, 0.92);
  }
}
const CITY = (() => {
  const r = rng(42);
  const make = (hMin, hMax, wMin, wMax) => {
    const bs = [];
    let x = -3;
    while (x < W + 3) {
      const w = Math.floor(lerp(wMin, wMax, r())), h = Math.floor(lerp(hMin, hMax, r()));
      const wins = [];
      for (let wy = HORIZON - h + 3; wy < HORIZON - 3; wy += 4)
        for (let wx = x + 2; wx < x + w - 2; wx += 3) wins.push([wx, wy, r()]);
      bs.push({ x, w, h, wins, ant: r() < 0.25 });
      x += w + (r() < 0.3 ? 1 : 0);
    }
    return bs;
  };
  return { far: make(40, 92, 9, 16), near: make(14, 58, 10, 20) };
})();
function drawCity(p) {
  const nightF = clamp01((p - 1.6) / 1.2);
  const dawnF = clamp01(1 - p / 0.8);
  const lit = Math.max(dawnF * 0.35, nightF);
  const farC = p < 1 ? mix(hex('#6C6E9E'), hex('#8FA6C6'), p) : mix(hex('#8FA6C6'), hex('#171C3C'), clamp01((p - 1) / 2));
  const nearC = p < 1 ? mix(hex('#4A4876'), hex('#5F7899'), p) : mix(hex('#5F7899'), hex('#0E1129'), clamp01((p - 1) / 2));
  const layer = (bs, col, winDark, winOn) => {
    for (const b of bs) {
      R(b.x, HORIZON - b.h, b.w, b.h, col);
      if (b.ant) R(b.x + Math.floor(b.w / 2), HORIZON - b.h - 4, 1, 4, col);
      for (const [wx, wy, th] of b.wins) {
        if (th < lit) R(wx, wy, 1, 2, winOn);
        else R(wx, wy, 1, 2, winDark);
      }
    }
  };
  layer(CITY.far, farC, mix(farC, hex('#000000'), 0.12), hex('#FFD86B'));
  layer(CITY.near, nearC, mix(nearC, hex('#000000'), 0.15), hex('#FFE38F'));
  R(0, HORIZON, W, 6, mix(nearC, hex('#000000'), 0.35));
}

function phoneBody() {
  const body = hex('#1C1B22'), edge = hex('#34323F');
  // basamaklı köşeler (r=4)
  const cut = [4, 2, 1, 1];
  for (let j = 0; j < PH; j++) {
    const c = j < 4 ? cut[j] : j >= PH - 4 ? cut[PH - 1 - j] : 0;
    R(PX + c, PY + j, PW - 2 * c, 1, body);
  }
  R(PX + 4, PY + 1, PW - 8, 1, edge);
  R(PX + 1, PY + 4, 1, PH - 8, edge);
  R(PX - 1, PY + 44, 1, 12, body); R(PX - 1, PY + 62, 1, 12, body);   // ses tuşları
  R(PX + PW, PY + 56, 1, 20, body);                                  // yan tuş
}

  [K.dragStart - 0.15, ...TGT.dragA], [K.dragStart + 0.05, ...TGT.dragA],
  [K.dragEnd, ...TGT.dragB], [K.dragEnd + 0.25, ...TGT.dragB],
  [K.tapTheme - 0.15, ...TGT.space], [K.gen + 0.1, ...TGT.space],
  [K.tapGen - 0.15, ...TGT.gen], [K.tapGen + 0.35, ...TGT.gen],
  [K.tapGen + 1.2, 196, 330], [99, 196, 330],
];
const TAPS = [K.tapPlus, K.tapCard, K.tapField, K.tapTheme, K.tapGen];
const TAP_POS = [TGT.plus, TGT.card2, TGT.field, TGT.space, TGT.gen];
function handPos(t) {
  for (let i = 0; i < HAND_KEYS.length - 1; i++) {
    const [t0, x0, y0] = HAND_KEYS[i], [t1, x1, y1] = HAND_KEYS[i + 1];
    if (t <= t1) {
      const e = easeInOut(prog(t, t0, t1));
      return [Math.round(lerp(x0, x1, e)), Math.round(lerp(y0, y1, e))];
    }
  }
  return [196, 330];
}
function pressed(t) {
  if (TAPS.some((tt) => t >= tt && t < tt + 0.15)) return true;
  return t >= K.dragStart + 0.05 && t < K.dragEnd + 0.1;
}
function drawHand(t) {
  // kare halka
  TAPS.forEach((tt, i) => {
    const k = prog(t, tt, tt + 0.4);
    if (k <= 0 || k >= 1) return;
    const r = Math.round(2 + easeOut(k) * 8);
    const [x, y] = TAP_POS[i];
    const a = 1 - k;
    R(x - r, y - r, 2 * r + 1, 1, C.white, a); R(x - r, y + r, 2 * r + 1, 1, C.white, a);
    R(x - r, y - r + 1, 1, 2 * r - 1, C.white, a); R(x + r, y - r + 1, 1, 2 * r - 1, C.white, a);
  });
  const [x, y] = handPos(t);
  const dy = pressed(t) ? 1 : 0;
  const pal = { '#': hex('#1A1A22'), w: hex('#FFFFFF'), s: hex('#C9CAD8') };
  HAND.forEach((row, j) => [...row].forEach((ch, i) => { if (pal[ch]) P(x - 3 + i, y + j + dy, pal[ch]); }));
}

// ---------------------------------------------------------------------------
// Alt şerit anlatı
// ---------------------------------------------------------------------------
const CAPS = [
  [K.hook + 0.3, 'hook'], [K.home, 'home'], [K.sheet, 'sheet'], [K.form, 'form'],
  [K.theme, 'theme'], [K.gen, 'gen'], [K.lib, 'lib'], [K.outro + 0.9, 'outro'],
];
function drawCaption(t) {
  R(0, 272, W, 48, hex('#15131D'));
  R(0, 272, W, 1, hex('#2C2840'));
  let cur = null;
  for (const c of CAPS) if (t >= c[0]) cur = c;
  if (!cur) return;
  const full = STR.captions[cur[1]];
  const n = Math.floor((t - cur[0]) * 26);
  const lines = wrap(full, 164, 8, true);
  let left = n;
  const y0 = lines.length === 1 ? 291 : 284;
  lines.forEach((ln, i) => {
    const vis = ln.slice(0, Math.max(0, left));
    left -= ln.length + 1;
    if (!vis) return;
    // satırı tam metnin genişliğine göre ortala; harfler soldan belirir
    const fw = measure(ln, 8, true);
    T(vis, Math.round(90 - fw / 2), y0 + i * 11, 8, C.white, { bold: true });
  });
}

// ---------------------------------------------------------------------------
// Kapanış kartı: piksel logo (AppIcon'dan: turuncu zemin, açık kitap, iki çocuk)
// ---------------------------------------------------------------------------
function logo(x0, y0) {
  at(x0, y0, () => {
    bands(0, 0, 40, 40, [hex('#F7A52A'), hex('#F08A1E'), hex('#E8621A')], 5, 'v');
    // çocuklar
    const skin = hex('#F3B08A'), hair = hex('#5A3524');
    disc(13, 15, 6, hair); disc(13, 17, 5, skin); R(8, 11, 11, 3, hair);
    P(11, 17, C.label); P(15, 17, C.label);
    disc(28, 19, 5, hair); disc(28, 21, 4, skin); R(24, 16, 9, 2, hair); R(23, 18, 2, 6, hair); R(32, 18, 2, 6, hair);
    P(26, 21, C.label); P(30, 21, C.label);
    R(7, 23, 12, 6, C.cyan); R(22, 25, 12, 5, hex('#F06292'));
    // kitap
    R(6, 30, 28, 4, hex('#C62828'));
    R(7, 26, 13, 5, C.white); R(20, 26, 13, 5, C.white);
    R(8, 25, 11, 1, C.white); R(21, 25, 11, 1, C.white);
    R(19, 26, 1, 5, C.gray4);
    // parıltı
    G('sparkle', 17, 17, hex('#FFF6C8'));
  });
}
function outroCard(t) {
  const a = easeOut(prog(t, K.outro + 0.8, K.outro + 1.3));
  if (a <= 0) return;
  ALPHA = a;
  logo(70, 96);
  T('MagicPaper', 90, 142, 11, C.white, { align: 'center', bold: true });
  T(STR.summary, 90, 160, 5.5, hex('#E4DCFF'), { align: 'center' });
  ALPHA = 1;
}

// ---------------------------------------------------------------------------
// draw(t)
// ---------------------------------------------------------------------------
function draw(t) {
  O.clearRect(0, 0, W * S, H * S);
  L.clearRect(0, 0, W, H);
  texts = []; clips = []; OX = 0; OY = 0; ALPHA = 1;

  const p = tod(t);
  drawSky(t, p);
  drawCity(p);
  flush();

  // Telefon: girişte aşağıdan kayar, çıkışta aşağı iner
  const inY = Math.round((1 - easeOut(prog(t, 0, 1.0))) * 300);
  const outY = Math.round(easeInOut(prog(t, K.outro, K.outro + 0.8)) * 300);
  const dy = inY + outY;
  if (dy < 300) {
    at(0, dy, () => {
      phoneBody();
      pushClip(SX, SY, SW, SH);
      at(SX, SY, () => {
        // taban ekran: sheet kapanana kadar Ana Sayfa, sonra Kütüphane
        if (t < K.lib) homeScreen(); else libraryScreen();
        flush();

        // Sheet: aşağıdan kayarak açılır, arka ekran kararır
        const open = easeOut(prog(t, K.sheet, K.sheet + 0.55)) * (1 - easeInOut(prog(t, K.lib, K.lib + 0.6)));
        if (open > 0) {
          R(0, 0, SW, SH, C.black, 0.4 * open);
          const top = Math.round(lerp(SH, SHEET_TOP, open));
          pushClip(0, top, SW, SH - top);
          at(0, top, () => {
            box(0, 0, SW, SH, C.white);
            const push = easeInOut(prog(t, K.tapCard + 0.2, K.tapCard + 0.7));
            const scroll = FORM_SCROLL * easeInOut(prog(t, K.dragStart + 0.05, K.dragEnd));
            if (push < 1) at(-Math.round(push * SW), 0, typeSheet);
            if (push > 0) at(Math.round((1 - push) * SW), 0, () => formSheet(t, scroll));
          });
          popClip();
          flush();

          // Yükleniyor katmanı (sheet üzerinde)
          if (t >= K.tapGen + 0.15 && t < K.loadEnd) {
            pushClip(0, SHEET_TOP, SW, SH - SHEET_TOP);
            R(0, SHEET_TOP, SW, SH - SHEET_TOP, C.black, 0.3);
            box(20, 88, 64, 40, hex('#141414'), 0.9);
            const step = Math.floor(t * 12) % 8;
            const ring = [[0, -5], [4, -4], [5, 0], [4, 4], [0, 5], [-4, 4], [-5, 0], [-4, -4]];
            ring.forEach(([rx, ry], i) => R(52 + rx - 1, 101 + ry - 1, 2, 2, C.white, ((i - step + 8) % 8) === 0 ? 1 : 0.3));
            wrap(STR.creating, 56, 4, true).forEach((s, i) => T(s, 52, 111 + i * 6, 4, C.white, { align: 'center', bold: true }));
            popClip();
            flush();
          }
          // Başarı uyarısı
          const al = prog(t, K.loadEnd, K.loadEnd + 0.2) * (1 - prog(t, K.alertEnd - 0.15, K.alertEnd));
          if (al > 0) {
            ALPHA = al;
            R(0, 0, SW, SH, C.black, 0.2);
            const lines = wrap(STR.loadingInLib, 62, 3.5);
            const h = 30 + lines.length * 5;
            const y = Math.round(110 - h / 2);
            box(16, y, 72, h, hex('#F4F4F7'));
            const sw = measure(STR.success, 4.5, true);
            const sx = Math.round(52 - (sw + 8) / 2);
            box(sx, y + 5, 7, 7, C.green); G('check', sx + 1, y + 6, C.white);
            T(STR.success, sx + 9, y + 5, 4.5, C.label, { bold: true });
            lines.forEach((s, i) => T(s, 52, y + 15 + i * 5, 3.5, C.label, { align: 'center' }));
            R(16, y + h - 11, 72, 1, C.gray4);
            T(STR.ok, 52, y + h - 8, 4.5, C.blue, { align: 'center', bold: true });
            ALPHA = 1;
            flush();
          }
        }
        screenCorners();
      });
      popClip();
      flush();
    });
  }

  outroCard(t);
  flush();

  drawCaption(t);
  flush();

  drawHand(t);
  flush();

  // Son 0,5 sn siyaha kararma
  const f = prog(t, K.fade, K.end);
  if (f > 0) { O.fillStyle = `rgba(0,0,0,${f})`; O.fillRect(0, 0, W * S, H * S); }
}

// Fontları bekle, ilk kareyi çiz
window.DURATION = DURATION;
window.FPS = FPS;
window.K = K;
window.draw = draw;
window.ready = Promise.all([
  document.fonts.load(font(5, false), 'AaÇçĞğİıÖöŞşÜü'),
  document.fonts.load(font(5, true), 'AaÇçĞğİıÖöŞşÜü'),
]).then(() => document.fonts.ready).then(() => { draw(0); return true; });

// Tarayıcıda izleme: ?play=1
if (new URLSearchParams(location.search).get('play')) {
  window.ready.then(() => {
    const t0 = performance.now();
    const loop = () => { const t = ((performance.now() - t0) / 1000) % DURATION; draw(t); requestAnimationFrame(loop); };
    loop();
  });
}
</script>
</body>
