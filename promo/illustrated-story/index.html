// ---------------------------------------------------------------------------

function rng(seed) {                 // mulberry32
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp01 = (v) => Math.max(0, Math.min(1, v));
const prog = (t, a, b) => clamp01((t - a) / (b - a));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeInOut = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const lerp = (a, b, t) => a + (b - a) * t;
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => [0, 1, 2].map((i) => Math.round(lerp(a[i], b[i], t)));
const css = (c, a = 1) => a >= 1 ? `rgb(${c[0]},${c[1]},${c[2]})` : `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
const bayer = (x, y) => (BAYER[((y % 4) + 4) % 4][((x % 4) + 4) % 4] + 0.5) / 16;

// ---------------------------------------------------------------------------
// Katmanlar: düşük çözünürlüklü piksel çizimi + yüksek çözünürlüklü yazı.
// flush() piksel katmanını 6× büyütüp basar, ardından bekleyen yazıları basar.
// ---------------------------------------------------------------------------
const out = document.getElementById('c');
const O = out.getContext('2d');
const lo = document.createElement('canvas');
lo.width = W; lo.height = H;
const L = lo.getContext('2d');
let texts = [];
let OX = 0, OY = 0;          // yerel koordinat başlangıcı
let clips = [];              // mutlak düşük çözünürlüklü kırpma dikdörtgenleri
let ALPHA = 1;

function flush() {
  O.imageSmoothingEnabled = false;
  O.drawImage(lo, 0, 0, W * S, H * S);
  L.clearRect(0, 0, W, H);
  for (const t of texts) drawText(t);
  texts = [];
}
function pushClip(x, y, w, h) {
  const r = { x: Math.round(x + OX), y: Math.round(y + OY), w: Math.round(w), h: Math.round(h) };
  const top = clips[clips.length - 1];
  if (top) {
    const x2 = Math.min(r.x + r.w, top.x + top.w), y2 = Math.min(r.y + r.h, top.y + top.h);
    r.x = Math.max(r.x, top.x); r.y = Math.max(r.y, top.y); r.w = Math.max(0, x2 - r.x); r.h = Math.max(0, y2 - r.y);
  }
  clips.push(r);
}
function popClip() { clips.pop(); }
function at(x, y, fn) { const ox = OX, oy = OY; OX += Math.round(x); OY += Math.round(y); fn(); OX = ox; OY = oy; }

function R(x, y, w, h, c, a = 1) {
  if (w <= 0 || h <= 0) return;
  let x0 = Math.round(x + OX), y0 = Math.round(y + OY), x1 = x0 + Math.round(w), y1 = y0 + Math.round(h);
  const cl = clips[clips.length - 1];
  if (cl) { x0 = Math.max(x0, cl.x); y0 = Math.max(y0, cl.y); x1 = Math.min(x1, cl.x + cl.w); y1 = Math.min(y1, cl.y + cl.h); }
  if (x1 <= x0 || y1 <= y0) return;
  L.fillStyle = css(c, a * ALPHA);
  L.fillRect(x0, y0, x1 - x0, y1 - y0);
}
function P(x, y, c, a = 1) { R(x, y, 1, 1, c, a); }
// Köşeleri 1 piksel kırpılmış kutu
function box(x, y, w, h, c, a = 1) {
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  R(x + 1, y, w - 2, 1, c, a); R(x, y + 1, w, h - 2, c, a); R(x + 1, y + h - 1, w - 2, 1, c, a);
}
function boxLine(x, y, w, h, c, a = 1) {
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  R(x + 1, y, w - 2, 1, c, a); R(x + 1, y + h - 1, w - 2, 1, c, a);
  R(x, y + 1, 1, h - 2, c, a); R(x + w - 1, y + 1, 1, h - 2, c, a);
}
// Bantlı gradyan; bant geçişlerinde 4×4 Bayer dither. dir: 'v' | 'h' | 'd'
function bands(x, y, w, h, stops, n, dir = 'v', clipped = true, a = 1) {
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  const cols = [];
  for (let i = 0; i < n; i++) cols.push(sampleStops(stops, (i + 0.5) / n));
  for (let j = 0; j < h; j++) {
    for (let i = 0; i < w; i++) {
      if (clipped && ((i === 0 || i === w - 1) && (j === 0 || j === h - 1))) continue;
      const v = dir === 'v' ? j / Math.max(1, h - 1) : dir === 'h' ? i / Math.max(1, w - 1)
        : (i / Math.max(1, w - 1) + j / Math.max(1, h - 1)) / 2;
      const f = v * n - 0.5;
      let k = Math.floor(f);
      const fr = f - k;
      if (fr > 0.6 && bayer(x + i + OX, y + j + OY) < (fr - 0.6) / 0.4) k++;
      k = Math.max(0, Math.min(n - 1, k));
      R(x + i, y + j, 1, 1, cols[k], a);
    }
  }
}
function sampleStops(stops, v) {
  const s = (stops.length - 1) * clamp01(v);
  const i = Math.min(stops.length - 2, Math.floor(s));
  return mix(stops[i], stops[i + 1], s - i);
}
function disc(cx, cy, r, c, a = 1) {
  for (let dy = -r; dy <= r; dy++) {
    const dx = Math.floor(Math.sqrt(r * r - dy * dy) + 0.35);
    R(cx - dx, cy + dy, dx * 2 + 1, 1, c, a);
  }
}
// Piksel ikonlar ('#' dolu)
const GLYPH = {
  house: ['...#...', '..###..', '.#####.', '#######', '.##.##.', '.##.##.', '.#####.'],
  books: ['##.##..', '##.##.#', '##.##.#', '##.##.#', '##.##.#', '##.##.#', '#######'],
  calendar: ['.#...#.', '#######', '#.....#', '#.#.#.#', '#.....#', '#.#.#.#', '#######'],
  gear: ['..#.#..', '.#####.', '##...##', '.#...#.', '##...##', '.#####.', '..#.#..'],
  plus: ['...##...', '...##...', '...##...', '########', '########', '...##...', '...##...', '...##...'],
  sparkle: ['...#...', '...#...', '..###..', '#######', '..###..', '...#...', '...#...'],
  photo: ['#######', '#.....#', '#...#.#', '#.#...#', '####..#', '#######'],
  textbook: ['######', '#....#', '#.##.#', '#....#', '#.##.#', '#....#', '######'],
  calplus: ['.#..#..', '######.', '#....#.', '#.#..#.', '#...###', '####.#.'],
  arrow: ['..#..', '...#.', '#####', '...#.', '..#..'],
  chevL: ['..#', '.#.', '#..', '.#.', '..#'],
  xmark: ['#...#', '.#.#.', '..#..', '.#.#.', '#...#'],
  check: ['.....#', '....##', '#..##.', '##.#..', '.##...', '..#...'],
  crown: ['#..#..#', '##.#.##', '#######', '#######'],
  search: ['.###.', '#...#', '#...#', '.###.', '....#'],

  rocket: ['...#...', '..###..', '..#.#..', '..###..', '..###..', '.#####.', '##.#.##', '#.....#'],
  lion: ['.#####.', '##...##', '#.#.#.#', '#..#..#', '##...##', '.#####.'],
  bolt: ['...##', '..##.', '.####', '..##.', '.##..', '##...'],

  bookFill: ['######', '######', '######', '######', '#....#', '######'],
};
function G(name, x, y, c, a = 1, scale = 1) {
  const g = GLYPH[name];
  for (let j = 0; j < g.length; j++)
    for (let i = 0; i < g[j].length; i++)
      if (g[j][i] === '#') R(x + i * scale, y + j * scale, scale, scale, c, a);
}
const gw = (name) => GLYPH[name][0].length;
const gh = (name) => GLYPH[name].length;

// Yazı: boyut düşük çözünürlük biriminde (5 → 30 px). Konum aynı 6 px ızgaraya oturur.
function font(size, bold) { return `${bold ? 700 : 400} ${Math.round(size * S)}px 'Pixelify Sans'`; }
function measure(s, size, bold) { O.font = font(size, bold); return O.measureText(s).width / S; }
function T(s, x, y, size, c, opt = {}) {
  const bold = !!opt.bold;
  O.font = font(size, bold);
  const wpx = O.measureText(s).width;
  let xl = (x + OX) * S;
  if (opt.align === 'center') xl -= wpx / 2;
  else if (opt.align === 'right') xl -= wpx;
  const xi = Math.round(xl / S) * S;
  const yi = Math.round(y + OY) * S;
  texts.push({ s, x: xi, y: yi, f: font(size, bold), c: css(c), a: (opt.a ?? 1) * ALPHA, clip: clips[clips.length - 1] });
  return wpx / S;
}
function drawText(t) {
  if (t.a <= 0) return;
  O.save();
  if (t.clip) { O.beginPath(); O.rect(t.clip.x * S, t.clip.y * S, t.clip.w * S, t.clip.h * S); O.clip(); }
  O.globalAlpha = t.a;
  O.font = t.f; O.fillStyle = t.c; O.textBaseline = 'top';
  O.fillText(t.s, t.x, t.y);
  O.restore();
}
function wrap(s, maxW, size, bold) {
  const words = s.split(' ');
  const lines = [];
  let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (measure(test, size, bold) <= maxW || !cur) cur = test;
    else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  return lines;
}

// ---------------------------------------------------------------------------
// Gökyüzü, güneş, ay, yıldızlar, bulutlar, şehir
// ---------------------------------------------------------------------------
// Öykünün saati: 0 şafak · 1 gündüz · 2 gün batımı · 3 gece
const TOD = [[0, 0], [4.5, 1], [12.5, 1.25], [17.5, 2], [21.2, 3], [99, 3]];
function tod(t) {
  for (let i = 0; i < TOD.length - 1; i++) {
    const [t0, p0] = TOD[i], [t1, p1] = TOD[i + 1];
    if (t <= t1) return lerp(p0, p1, easeInOut(prog(t, t0, t1)));
  }
  return 3;
}
const SKY = [
  ['#3B4A8C', '#B87AA8', '#FFB88A'],   // şafak
  ['#3F86D8', '#78B9EC', '#C9E8F8'],   // gündüz
  ['#3A3674', '#C8627C', '#FFA95A'],   // gün batımı
  ['#070B1E', '#141A42', '#262C62'],   // gece
].map((r) => r.map(hex));
function skyAt(p) {
  const i = Math.min(2, Math.floor(p)), f = p - i;
  return [0, 1, 2].map((k) => mix(SKY[i][k], SKY[i + 1][k], f));
}
const HORIZON = 266;
const skyImg = L.createImageData(W, H);
function drawSky(t, p) {
  const st = skyAt(p);
  const n = 12;
  const cols = [];
  for (let i = 0; i < n; i++) cols.push(sampleStops(st, (i + 0.5) / n));
  const d = skyImg.data;
  for (let y = 0; y < H; y++) {
    const f = (y / HORIZON) * n - 0.5;
    for (let x = 0; x < W; x++) {
      let k = Math.floor(f);
      const fr = f - k;
      if (fr > 0.55 && bayer(x, y) < (fr - 0.55) / 0.45) k++;
      k = Math.max(0, Math.min(n - 1, k));
      const c = cols[k], o = (y * W + x) * 4;
      d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255;
    }
  }
  L.putImageData(skyImg, 0, 0);

  // Yıldızlar
  const night = clamp01((p - 2.25) / 0.6);
  if (night > 0) {
    const r = rng(7);
    for (let i = 0; i < 46; i++) {
      const x = Math.floor(r() * W), y = Math.floor(r() * 190), ph = r() * 6.28, big = r() < 0.18;
      const tw = Math.sin(t * (1.3 + r()) + ph);
      const a = night * (tw > -0.4 ? 1 : 0.35);

function sprite(rows, x, y, opts = {}) {
  const sc = opts.scale || 1, pal = Object.assign({}, PAL, opts.pal || {});
  const h = rows.length, w = rows[0].length;
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    let ch = rows[j][i];
    if (ch === '.') continue;

    const col = pal[ch];

    const [px, py] = opts.rot ? [h - 1 - j, i] : [i, j];
    R(x + px * sc, y + py * sc, sc, sc, col, opts.a ?? 1);
  }
  if (opts.closed) {       // kapalı göz: iki piksellik çizgi
    for (const e of [1, 7]) R(x + e * sc, y + 5 * sc, 2 * sc, sc, PAL.e);

    if (i === 1) { R(9, 8, 3, 8, PAL.W); R(9, 7, 3, 1, PAL.r); R(10, 16, 1, 2, hex('#FFB23F')); }
    if (i === 2) { R(0, 19, 20, 7, hex('#5B2C7A')); R(12, 13, 5, 6, PAL.g); P(14, 15, C.white); }
    if (i === 3) { for (let c = 0; c < 4; c++) R(2 + c * 5, 10 + (c % 2) * 4, 3, 16, hex('#9FF2E6')); }
    if (i === 4) { disc(6, 8, 2, hex('#8A7A6A')); disc(14, 16, 3, hex('#8A7A6A')); }
    if (i === 5) { for (let c = 0; c < 5; c++) P(3 + c * 3, 5 + (c % 2) * 3, hex('#FFF3A0')); }
    if (i === 6) { P(5, 5, C.white); P(14, 4, C.white); P(10, 9, hex('#FFE9B0')); R(9, 15, 2, 5, PAL.B); R(9, 13, 2, 2, PAL.H); }
  });
  if (k < 1) photoRevealMask(x, y, 20, 26, k);
}
function genView(t) {
  bands(0, 0, SW, SH, [C.bgLight, C.bgLight2], 2, 'v', false);
  statusBar(); header(2);
  const done = Math.min(STORY_PAGES, Math.floor(Math.max(0, t - K.thumbs) / THUMB_STEP + 1e-6) + (t >= K.thumbs ? 1 : 0));
  box(40, 30, 24, 24, C.white);
  portrait(42, 32, 2);
  wrap(STR.generatingImages, 90, 5, true).forEach((s, i) => T(s, 52, 60 + i * 7, 5, C.label, { align: 'center', bold: true }));
  T(`${Math.min(done, STORY_PAGES)}/${STORY_PAGES}`, 52, 70, 4.5, C.brandPurple, { align: 'center', bold: true });
  for (let i = 0; i < STORY_PAGES; i++) {
    const row = i < 4 ? 0 : 1;
    const x = row === 0 ? 6 + i * 24 : 18 + (i - 4) * 24;
    const y = 82 + row * 30;
    const k = prog(t, K.thumbs + i * THUMB_STEP, K.thumbs + i * THUMB_STEP + 0.28);
    thumb(i, x, y, k);
  }
  const bar = prog(t, K.thumbs, K.thumbs + STORY_PAGES * THUMB_STEP);
  box(10, 150, 84, 4, C.gray6);
  R(11, 151, Math.round(82 * bar), 2, C.brandPurple);
}
function miniLogo(x, y) {
  box(x, y, 12, 12, hex('#F08A1E'));
  R(x + 2, y + 5, 8, 4, C.white); R(x + 6, y + 5, 1, 4, C.gray4); R(x + 2, y + 9, 8, 1, hex('#C62828'));
  P(x + 6, y + 2, hex('#FFF6C8')); P(x + 5, y + 3, hex('#FFF6C8')); P(x + 7, y + 3, hex('#FFF6C8'));
}
function banner(t) {
  const k = easeOut(prog(t, K.ready + 0.1, K.ready + 0.5));
  if (k <= 0) return;
  const y = Math.round(lerp(-40, 12, k));
  const lines = wrap(STR.notifBody(NAME), 72, 3.5);
  const h = 16 + lines.length * 5;
  const pr = t >= K.tapBanner && t < K.tapBanner + 0.15 ? 1 : 0;
  box(4, y + pr, 96, h, hex('#2A2833'), 0.96);
  miniLogo(8, y + 4 + pr);
  T(STR.notifTitle, 24, y + 4 + pr, 4.5, C.white, { bold: true });
  lines.forEach((s, i) => T(s, 24, y + 11 + i * 5 + pr, 3.5, hex('#D8D6E4')));
}

// ---------------------------------------------------------------------------
// Masal sayfaları (tam kare, kağıt çerçeveli)
// ---------------------------------------------------------------------------
const PAPER = hex('#F3E6C8'), PAPER_LINE = hex('#D9C39A'), INK = hex('#7A5E3A');
function pageFrame(n) {
  R(0, 0, W, 5, PAPER); R(0, 0, 5, STAGE, PAPER); R(W - 5, 0, 5, STAGE, PAPER); R(0, 252, W, STAGE - 252, PAPER);
  R(5, 5, W - 10, 1, PAPER_LINE); R(5, 251, W - 10, 1, PAPER_LINE); R(5, 5, 1, 247, PAPER_LINE); R(W - 6, 5, 1, 247, PAPER_LINE);
  T(`${n} / ${STORY_PAGES}`, 90, 256, 4.5, INK, { align: 'center', bold: true });
}
function grass(y, c1, c2) {
  bands(5, y, W - 10, 252 - y, [c1, c2], 3, 'v', false);
  const r = rng(y);
  for (let i = 0; i < 40; i++) P(6 + Math.floor(r() * (W - 12)), y + 1 + Math.floor(r() * 3), c1);
}
function page0(lt) {       // 1: bahçede roket
  bands(5, 5, W - 10, 200, [hex('#2E2A5C'), hex('#8A4E86'), hex('#E07A74'), hex('#FFB27A')], 8, 'v', false);
  starsIn(6, 8, W - 12, 60, 14, 21, lt, clamp01(lt / 2));
  disc(150, 150, 12, hex('#FFC27A'), 0.5);
  // çit
  for (let x = 6; x < W - 6; x += 7) R(x, 178, 3, 22, hex('#C8A27A'));
  R(5, 184, W - 10, 2, hex('#B08A62')); R(5, 193, W - 10, 2, hex('#B08A62'));
  grass(200, hex('#3E7A4A'), hex('#2A5234'));
  // ağaç
  R(22, 150, 6, 52, hex('#5A3A28'));
  disc(25, 140, 16, hex('#2F5E3A')); disc(14, 150, 10, hex('#2A5234')); disc(36, 148, 11, hex('#35683F'));
  // roket
  sprite(ROCKET, 118, 170, { pal: { n: hex('#9ED8FF') } });
  R(116, 186, 16, 1, hex('#1F3A26'));
  // çocuk yürür
  const k = easeInOut(prog(lt, 0.2, 2.4));
  const x = Math.round(lerp(46, 96, k));
  const moving = lt > 0.2 && lt < 2.4;
  const rows = moving && Math.floor(lt * 5) % 2 ? KID.slice(0, 14).concat(KID_STEP) : KID;
  sprite(rows, x, 184);
}
function page1(lt) {       // 2: kalkış
  bands(5, 5, W - 10, 247, [hex('#02040E'), hex('#0A1030'), hex('#1A2560')], 7, 'v', false);
  starsIn(6, 6, W - 12, 200, 60, 31, lt);
  // Dünya
  for (let dy = -118; dy <= 0; dy++) {
    const dx = Math.floor(Math.sqrt(118 * 118 - dy * dy));
    const y = 348 + dy - 0;
    if (y >= 252 || y < 5) continue;
    R(Math.max(5, 90 - dx), y, Math.min(W - 5, 90 + dx) - Math.max(5, 90 - dx), 1, hex('#2F6FD0'));
    if (dy === -118 + 0) continue;
  }
  const lr = rng(8);
  for (let i = 0; i < 9; i++) {
    const cx = 20 + Math.floor(lr() * 140), cy = 238 + Math.floor(lr() * 12);
    disc(cx, cy, 3 + Math.floor(lr() * 4), hex('#4FA85A'));
  }
  for (let dx = -110; dx <= 110; dx++) {
    const y = 348 - Math.floor(Math.sqrt(118 * 118 - dx * dx)) - 1;
    if (y < 252) P(90 + dx, y, hex('#9FD4FF'));
  }
  R(0, 252, W, 20, PAPER);
  // roket yükselir
  const k = easeOut(prog(lt, 0.1, 2.6));
  const y = Math.round(lerp(196, 70, k));
  sprite(ROCKET, 84, y, { pal: { n: PAL.s } });
  flame(88, y + 16, lt, 5);
}
function page2(lt) {       // 3: mor gezegen, yeni dost
  bands(5, 5, W - 10, 200, [hex('#2A1450'), hex('#6A2F8E'), hex('#B35FB0'), hex('#E7A0CF')], 8, 'v', false);
  starsIn(6, 8, W - 12, 70, 16, 41, lt);
  disc(140, 40, 10, hex('#F7D9F0')); disc(40, 62, 5, hex('#BFE8FF'));
  // kristal kuleler
  const spire = (x, h, c) => { for (let j = 0; j < h; j++) { const w = Math.max(1, Math.floor((j / h) * 8)); R(x - Math.floor(w / 2), 200 - h + j, w, 1, c); } };
  spire(24, 60, hex('#58E0D0')); spire(38, 38, hex('#3FB8B0')); spire(150, 70, hex('#58E0D0')); spire(162, 44, hex('#3FB8B0'));
  bands(5, 196, W - 10, 56, [hex('#6B3590'), hex('#46205F')], 3, 'v', false);
  // uzakta roket
  sprite(ROCKET, 128, 176, { pal: { n: hex('#9ED8FF') } });
  // çocuk ve uzaylı
  const gy = 14;
  sprite(KID, 62, 196 + gy);
  const wave = Math.floor(lt * 3) % 2 === 0;
  sprite(ALIEN, 96, 202 + gy);
  P(96, 208 + gy, PAL.g); P(95, 209 + gy, PAL.g);                   // sol kol
  if (wave) { P(107, 205 + gy, PAL.g); P(108, 204 + gy, PAL.g); P(108, 203 + gy, PAL.g); }
  else { P(107, 208 + gy, PAL.g); P(108, 209 + gy, PAL.g); }
}
function page3(lt) {       // 5: taş yağmuru
  bands(5, 5, W - 10, 247, [hex('#05081A'), hex('#0E1433'), hex('#1A1F44')], 6, 'v', false);
  starsIn(6, 6, W - 12, 244, 40, 51, lt);
  const ar = rng(61);
  const rocks = [];
  for (let i = 0; i < 12; i++) rocks.push([ar() * 220, ar() * 260, 2 + Math.floor(ar() * 7), 0.6 + ar() * 0.8]);
  for (const [x0, y0, r, v] of rocks) {
    const x = Math.round(((x0 - lt * 22 * v) % 230 + 230) % 230 - 20);
    const y = Math.round(((y0 + lt * 9 * v) % 260 + 260) % 260);
    if (y < 5 || y > 250) continue;
    disc(x, y, r, hex('#7A6A5C')); disc(x - 1, y - 1, Math.max(1, r - 2), hex('#94826F'));
    if (r > 3) P(x + 1, y + 1, hex('#5A4D42'));
  }
  // yatay roket: pencerede çocuk ve uzaylı
  const rx = 60, ry = 118;
  sprite(ROCKET, rx, ry, { rot: true, pal: { n: PAL.s } });
  flame(rx, ry + 4, lt, 5, true);
  // ikinci pencere: uzaylı
  disc(rx + 7, ry + 10, 2, PAL.x); disc(rx + 7, ry + 10, 1, PAL.g);
}
function page4(lt) {       // 7: eve dönüş
  bands(5, 5, W - 10, 200, [hex('#050818'), hex('#0E1438'), hex('#1E2658')], 7, 'v', false);
  starsIn(6, 8, W - 12, 150, 55, 71, lt);
  crescent(40, 36, 7, hex('#F4EFC8'));
  // özel yıldız yavaşça parlar
  const pulse = 0.5 + 0.5 * Math.sin(lt * 2.2);
  const sx = 132, sy = 58;
  P(sx, sy, hex('#FFF3C0'));
  if (pulse > 0.35) { P(sx - 1, sy, hex('#FFF3C0'), pulse); P(sx + 1, sy, hex('#FFF3C0'), pulse); P(sx, sy - 1, hex('#FFF3C0'), pulse); P(sx, sy + 1, hex('#FFF3C0'), pulse); }
  if (pulse > 0.75) { P(sx - 2, sy, hex('#FFF3C0'), 0.5); P(sx + 2, sy, hex('#FFF3C0'), 0.5); P(sx, sy - 2, hex('#FFF3C0'), 0.5); P(sx, sy + 2, hex('#FFF3C0'), 0.5); }
  // ev
  R(12, 150, 50, 50, hex('#161A36'));
  for (let j = 0; j < 20; j++) R(12 + 25 - j - 5, 130 + j, (j + 5) * 2, 1, hex('#161A36'));
  R(24, 166, 10, 10, hex('#FFD86B')); R(28, 166, 1, 10, hex('#161A36')); R(24, 170, 10, 1, hex('#161A36'));
  for (let x = 66; x < W - 6; x += 7) R(x, 180, 3, 20, hex('#232845'));
  R(62, 186, W - 68, 2, hex('#1C2140'));
  grass(200, hex('#1F3A2A'), hex('#12241A'));
  // çocuk yukarı bakar (arkadan: yüzsüz baş)
  const back = KID.map((r, j) => (j >= 3 && j <= 7 ? r.replace(/[secm]/g, 'H') : r));
  sprite(back, 110, 184);
}
const PAGES = [page0, page1, page2, page3, page4];
function drawPage(i, t) {
  const lt = t - (K.pages[i] - 0.6);
  PAGES[i](lt);
  pageFrame(PAGE_NUMS[i]);
}

// ---------------------------------------------------------------------------
// El imleci
// ---------------------------------------------------------------------------
const TGT = { photo: [90, 126], field: [78, 110], space: [114, 98], create: [90, 232], banner: [90, 62] };
const OFF = [196, 330];
const HAND_KEYS = [
  [0, ...OFF], [K.phoneIn + 0.8, ...OFF],
  [K.tapPhoto - 0.15, ...TGT.photo], [K.name + 0.3, ...TGT.photo],
  [K.tapField - 0.15, ...TGT.field], [K.theme + 0.2, ...TGT.field],
  [K.tapTheme - 0.15, ...TGT.space], [K.create + 0.1, ...TGT.space],
  [K.tapCreate - 0.15, ...TGT.create], [K.tapCreate + 0.3, ...TGT.create],
  [K.tapCreate + 1.1, ...OFF], [K.ready + 0.3, ...OFF],
  [K.tapBanner - 0.15, ...TGT.banner], [K.tapBanner + 0.25, ...TGT.banner],
  [K.tapBanner + 0.9, ...OFF], [99, ...OFF],
];
const TAPS = [[K.tapPhoto, TGT.photo], [K.tapField, TGT.field], [K.tapTheme, TGT.space], [K.tapCreate, TGT.create], [K.tapBanner, TGT.banner]];
function handPos(t) {
  for (let i = 0; i < HAND_KEYS.length - 1; i++) {
    const [t0, x0, y0] = HAND_KEYS[i], [t1, x1, y1] = HAND_KEYS[i + 1];
    if (t <= t1) {
      const e = easeInOut(prog(t, t0, t1));
      return [Math.round(lerp(x0, x1, e)), Math.round(lerp(y0, y1, e))];
    }
  }
  return OFF;
}
function drawHand(t) {
  for (const [tt, [x, y]] of TAPS) {
    const k = prog(t, tt, tt + 0.4);
    if (k <= 0 || k >= 1) continue;
    const r = Math.round(2 + easeOut(k) * 8), a = 1 - k;
    R(x - r, y - r, 2 * r + 1, 1, C.white, a); R(x - r, y + r, 2 * r + 1, 1, C.white, a);
    R(x - r, y - r + 1, 1, 2 * r - 1, C.white, a); R(x + r, y - r + 1, 1, 2 * r - 1, C.white, a);
  }
  const [x, y] = handPos(t);
  if (y >= H) return;
  const dy = TAPS.some(([tt]) => t >= tt && t < tt + 0.15) ? 1 : 0;
  const pal = { '#': hex('#1A1A22'), w: hex('#FFFFFF'), s: hex('#C9CAD8') };
  HAND.forEach((row, j) => [...row].forEach((ch, i) => { if (pal[ch]) P(x - 3 + i, y + j + dy, pal[ch]); }));
}

// ---------------------------------------------------------------------------
// Anlatı şeridi
// ---------------------------------------------------------------------------
const CAPS = [
  [K.hook + 0.4, 'hook'], [K.phoneIn + 0.3, 'photo'], [K.name, 'name'], [K.theme, 'theme'],
  [K.create, 'create'], [K.ready, 'ready'],
  ...K.pages.map((p, i) => [p - 0.3, 'p' + i]),
  [K.sleep + 0.2, 'sleep'], [K.outro + 0.8, 'outro'],
];
function drawCaption(t) {
  R(0, STAGE, W, H - STAGE, hex('#15131D'));
  R(0, STAGE, W, 1, hex('#2C2840'));
  let cur = null;
  for (const c of CAPS) if (t >= c[0]) cur = c;
  if (!cur) return;
  const full = STR.captions[cur[1]];
  const n = Math.floor((t - cur[0]) * 26);
  const lines = wrap(full, 164, 8, true);
  let left = n;
  const y0 = lines.length === 1 ? 291 : 284;
  lines.forEach((ln, i) => {
    const vis = ln.slice(0, Math.max(0, left));
    left -= ln.length + 1;
    if (!vis) return;
    const fw = measure(ln, 8, true);
    T(vis, Math.round(90 - fw / 2), y0 + i * 11, 8, C.white, { bold: true });
  });
}

// ---------------------------------------------------------------------------
// Bayer geçişi: iki piksel sahnesi arasında (yazısız) erime
// ---------------------------------------------------------------------------
function dissolve(fa, fb, k) {
  L.clearRect(0, 0, W, H); fa(); texts = [];
  const A = L.getImageData(0, 0, W, STAGE);
  L.clearRect(0, 0, W, H); fb(); texts = [];
  const B = L.getImageData(0, 0, W, STAGE);
  for (let y = 0; y < STAGE; y++) for (let x = 0; x < W; x++) {
    if (bayer(x, y) < k) { const o = (y * W + x) * 4; for (let c = 0; c < 4; c++) A.data[o + c] = B.data[o + c]; }
  }
  L.clearRect(0, 0, W, H);
  L.putImageData(A, 0, 0);
}
function outroBg(t) {
  drawSky(t, 3);
  drawCity(3);
}

// ---------------------------------------------------------------------------
// draw(t)
// ---------------------------------------------------------------------------
function draw(t) {
  O.clearRect(0, 0, W * S, H * S);
  L.clearRect(0, 0, W, H);
  texts = []; clips = []; OX = 0; OY = 0; ALPHA = 1;

  const lampK = 1 - easeInOut(prog(t, K.lampOff, K.lampOff + 0.5));
  const lastPage = K.pages.length - 1;

  if (t < K.pages[0]) {
    // yatak odası + telefon
    bedroom(t, false, 1);
    const dim = easeOut(prog(t, K.phoneIn, K.phoneIn + 0.6)) * (1 - easeInOut(prog(t, K.book, K.book + 0.6)));
    if (dim > 0) R(0, 0, W, STAGE, hex('#05040C'), 0.6 * dim);
    flush();
    const inY = Math.round((1 - easeOut(prog(t, K.phoneIn, K.phoneIn + 0.8))) * 300);
    const outY = Math.round(easeInOut(prog(t, K.book, K.book + 0.6)) * 300);
    const dy = inY + outY;
    if (dy < 300) {
      at(0, dy, () => {
        phoneBody();
        pushClip(SX, SY, SW, SH);
        at(SX, SY, () => {
          const screens = [[K.name, step1], [K.theme, step2], [K.tapCreate + 0.15, step3], [99, genView]];
          let idx = screens.findIndex(([t1]) => t < t1);
          const tStart = idx > 0 ? screens[idx - 1][0] : -1;
          const push = idx > 0 ? easeInOut(prog(t, tStart, tStart + 0.5)) : 1;
          if (push < 1) at(-Math.round(push * SW), 0, () => screens[idx - 1][1](t));
          at(Math.round((1 - push) * SW), 0, () => screens[idx][1](t));
          flush();
          banner(t);
          flush();
          screenCorners();
        });
        popClip();
        flush();
      });
    }
    // ilk sayfa sağdan gelir (sayfa çevirme)
    const turn = easeInOut(prog(t, K.pages[0] - 0.6, K.pages[0]));
    if (turn > 0) {
      const x = Math.round((1 - turn) * W);
      at(x, 0, () => { pushClip(0, 0, W, STAGE); drawPage(0, t); popClip(); });
      R(x - 2, 0, 2, STAGE, hex('#000000'), 0.35);
      flush();
    }
  } else if (t < K.sleep) {
    // masal sayfaları
    let i = 0;
    while (i < lastPage && t >= K.pages[i + 1] - 0.6) i++;
    if (i > 0 && t < K.pages[i]) {
      // sayfa i sağdan geliyor, altta i-1
      drawPage(i - 1, t); flush();
      const x = Math.round((1 - easeInOut(prog(t, K.pages[i] - 0.6, K.pages[i]))) * W);
      at(x, 0, () => { pushClip(0, 0, W, STAGE); drawPage(i, t); popClip(); });
      R(x - 2, 0, 2, STAGE, hex('#000000'), 0.35);
      flush();
    } else {
      drawPage(i, t); flush();
    }
  } else if (t < K.outro) {
    const k = easeInOut(prog(t, K.sleep, K.sleep + 0.7));
    if (k < 1) dissolve(() => drawPage(lastPage, t), () => bedroom(t, true, lampK), k);
    else bedroom(t, true, lampK);
    flush();
  } else {
    const k = easeInOut(prog(t, K.outro, K.outro + 0.7));
    if (k < 1) dissolve(() => bedroom(t, true, 0), () => outroBg(t), k);
    else outroBg(t);
    flush();
    const a = easeOut(prog(t, K.outro + 0.6, K.outro + 1.1));
    if (a > 0) {
      ALPHA = a;
      logo(70, 92);
      T('MagicPaper', 90, 138, 11, C.white, { align: 'center', bold: true });
      T(STR.summary, 90, 156, 5.5, hex('#E4DCFF'), { align: 'center' });
      ALPHA = 1;
      flush();
    }
  }

  drawCaption(t);
  flush();
  drawHand(t);
  flush();

  const f = prog(t, K.fade, K.end);
  if (f > 0) { O.fillStyle = `rgba(0,0,0,${f})`; O.fillRect(0, 0, W * S, H * S); }
}

window.DURATION = DURATION;
window.FPS = FPS;
window.K = K;
window.draw = draw;
window.ready = Promise.all([
  document.fonts.load(font(5, false), 'AaÇçĞğİıÖöŞşÜü'),
  document.fonts.load(font(5, true), 'AaÇçĞğİıÖöŞşÜü'),
]).then(() => document.fonts.ready).then(() => { draw(0); return true; });

if (new URLSearchParams(location.search).get('play')) {
  window.ready.then(() => {
    const t0 = performance.now();
    const loop = () => { draw(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
    loop();
  });
}
</script>
