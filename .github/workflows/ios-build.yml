name: iOS Build and Test

# main'e her gönderimde ve main'e açılan her PR'da uygulamayı derler ve
# testleri koşar (MagicPaperTests + StoryEngine paketinin testleri, TestPlan).
#
# 25 Kasım 2026: upload/download-artifact@v3'ü GitHub otomatik reddediyordu;
# iş 5 saniyede düşüyor, testler hiç koşmuyordu. İmzasız Release arşivi ve
# içi boş deploy işi kaldırıldı: yayın Xcode Cloud'dan (ci_scripts/) çıkıyor,
# burada yalnızca macOS dakikası harcıyorlardı.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Aynı dalda yeni gönderim gelince eski koşu iptal edilir (macOS dakikası pahalı).
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and Test
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Cache Swift Package Manager
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Caches/org.swift.swiftpm
          ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Placeholder secrets
      env:
        GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
      run: bash Scripts/ci_placeholders.sh

    - name: Resolve Dependencies
      run: xcodebuild -resolvePackageDependencies -project MagicPaper.xcodeproj -scheme MagicPaper

    - name: Run Tests
      run: |
        set -o pipefail
        # Kurulu ilk iPhone simülatörü: ad Xcode sürümüyle değişiyor.
        DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in d if 'iOS' in r for x in d[r] if x['name'].startswith('iPhone')))")
        # Görüntü testleri yalnız referansların üretildiği cihazda anlamlı (iPhone 17 Pro, iOS 27).
        xcodebuild test \
          -project MagicPaper.xcodeproj \
          -scheme MagicPaper \
          -destination "id=$DEVICE" \
          -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
          -skip-testing:MagicPaperTests/DesignSystemSnapshotTests \
          -skip-testing:MagicPaperUITests \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO

    - name: Upload Test Results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: TestResults
        path: ${{ runner.temp }}/TestResults.xcresult
        retention-days: 14
