name: iOS Build and Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Cache Swift Package Manager
      uses: actions/cache@v3
      with:
        path: |
          ~/Library/Developer/Xcode/DerivedData
          ~/.swiftpm
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-
          
    - name: Install Dependencies
      run: |
        xcodebuild -resolvePackageDependencies -project MagicPaper.xcodeproj -scheme MagicPaper
        
    - name: Run Tests
      run: |
        # Kurulu ilk iPhone simülatörü: ad Xcode sürümüyle değişiyor.
        DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in d if 'iOS' in r for x in d[r] if x['name'].startswith('iPhone')))")
        # Görüntü testleri yalnız referansların üretildiği cihazda anlamlı (iPhone 17 Pro, iOS 27).
        xcodebuild test \
          -project MagicPaper.xcodeproj \
          -scheme MagicPaper \
          -destination "id=$DEVICE" \
          -skip-testing:MagicPaperTests/DesignSystemSnapshotTests \
          -skip-testing:MagicPaperUITests \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO
          
    - name: Build for Archive (Release)
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      run: |
        xcodebuild clean archive \
          -project MagicPaper.xcodeproj \
          -scheme MagicPaper \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath ${{ runner.temp }}/MagicPaper.xcarchive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          ONLY_ACTIVE_ARCH=NO
          
    - name: Upload Build Artifacts
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: actions/upload-artifact@v3
      with:
        name: MagicPaper-Archive
        path: ${{ runner.temp }}/MagicPaper.xcarchive
        retention-days: 30

  # App Store Connect yükleme işi (opsiyonel)
  deploy:
    name: Deploy to App Store Connect
    runs-on: macos-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Download Build Artifacts
      uses: actions/download-artifact@v3
      with:
        name: MagicPaper-Archive
        path: ${{ runner.temp }}
        
    # Bu adımlar için App Store Connect API Key gerekli
